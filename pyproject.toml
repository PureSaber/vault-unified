[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-unified"
version = "0.2.0"
description = "Unified password vault: local encrypted storage + Proton Pass + Bitwarden"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
]

[project.scripts]
vault = "vault_unified.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
