name: Prepare v1.1.0

on:
  push:
    branches: ["automation/release-prep-v1.1.0"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate release preparation changes
        run: python .github/scripts/prepare_release_v1_1_0.py
      - name: Validate generated patch
        shell: bash
        run: |
          git diff --check
          git diff --stat
          test -f docs/release-v1.1.0.md
      - name: Commit generated release preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pyproject.toml src apps tests docs
          git commit -m "chore: prepare v1.1.0 release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
