name: Fix v1.1.0 release documentation

on:
  push:
    branches: ["automation/release-prep-v1.1.0"]

permissions:
  contents: write

jobs:
  fix-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Correct release documentation
        run: python .github/scripts/fix_release_docs_v1_1_0.py
      - name: Validate documentation patch
        shell: bash
        run: |
          git diff --check
          grep -F '# Vault Unified v1.1.0' README.md
          grep -F 'Windows Credential Manager' README.md
          if grep -Fq '缺省或 `null` 表示四个外源全部启用' README.md; then exit 1; fi
      - name: Commit corrected documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/vault-v3-threat-model.md
          git commit -m "docs: align v1.1.0 setup and compatibility guidance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
