name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install -e ".[dev]"
      - name: Test
        run: .\.venv\Scripts\pytest -q

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Install & typecheck
        working-directory: apps/desktop
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Prepare externalBin placeholder for Rust tests
        shell: pwsh
        run: |
          $path = "apps/desktop/src-tauri/binaries/vault-api-sidecar-x86_64-pc-windows-msvc.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
          New-Item -ItemType File -Force -Path $path | Out-Null
      - name: Check authenticated sidecar launcher
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

  release-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, desktop]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Build sidecar + Tauri installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-desktop-release.ps1
      - name: Upload Release Assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
