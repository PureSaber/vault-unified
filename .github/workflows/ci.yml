name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install -e ".[dev]"
      - name: Test
        run: .\.venv\Scripts\pytest -q

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install & typecheck
        working-directory: apps/desktop
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Prepare externalBin placeholder for Rust tests
        shell: pwsh
        run: |
          $path = "apps/desktop/src-tauri/binaries/vault-api-sidecar-x86_64-pc-windows-msvc.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
          New-Item -ItemType File -Force -Path $path | Out-Null
      - name: Check authenticated sidecar launcher
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

  release-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, desktop]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sidecar + Tauri installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-desktop-release.ps1
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
