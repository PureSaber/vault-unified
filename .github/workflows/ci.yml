name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install -e ".[dev]"
      - name: Test
        run: .\.venv\Scripts\pytest -q

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Install & typecheck
        working-directory: apps/desktop
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Prepare externalBin placeholder for Rust tests
        shell: pwsh
        run: |
          $path = "apps/desktop/src-tauri/binaries/vault-api-sidecar-x86_64-pc-windows-msvc.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
          New-Item -ItemType File -Force -Path $path | Out-Null
      - name: Check authenticated sidecar launcher
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Parse release validator PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/validate-desktop-release.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Release validator contains PowerShell syntax errors"
          }

  ui-journey:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install renderer journey dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: npm run test:ui:install
      - name: Run generated-data renderer journeys and scan artifacts
        id: ui-journeys
        continue-on-error: true
        working-directory: apps/desktop
        run: npm run test:ui
      - name: Upload scanned failure artifacts
        if: ${{ always() && steps.ui-journeys.outcome == 'failure' && hashFiles('apps/desktop/test-results/.artifacts-safe') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-journey-failure-${{ github.run_id }}
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce renderer journey result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.ui-journeys.outcome }}" -ne "success") {
            throw "Renderer journey failed; only marker-scanned generated-data artifacts were eligible for upload"
          }

  rustsec:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit Rust dependencies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "cargo-audit-0.22.2.zip"
          $toolRoot = Join-Path $env:RUNNER_TEMP "cargo-audit-0.22.2"
          Invoke-WebRequest -Uri "https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-pc-windows-msvc-v0.22.2.zip" -OutFile $archive
          $expected = "0a7316540862c13d954f648917ceacca593747baed6eec180fafa590be2710ab"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "cargo-audit archive digest mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          $audit = Get-ChildItem -LiteralPath $toolRoot -Filter cargo-audit.exe -Recurse | Select-Object -First 1
          if (-not $audit) {
            throw "cargo-audit.exe was not present in the verified archive"
          }
          & $audit.FullName audit --url https://github.com/RustSec/advisory-db.git --file apps/desktop/src-tauri/Cargo.lock

  release-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, desktop, ui-journey, rustsec]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Build sidecar + Tauri installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-desktop-release.ps1
      - name: Validate packaged sidecar and installers
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/validate-desktop-release.ps1
      - name: Upload Release Assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vault Unified ${{ github.ref_name }}
          body_path: docs/release-${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            Vault-Unified-Browser-Extension-v*.zip
            release-manifest-v*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-download and verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP "published-$env:GITHUB_REF_NAME"
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir $download
          if ($LASTEXITCODE -ne 0) { throw "Independent release download failed" }
          $manifests = @(Get-ChildItem -LiteralPath $download -Filter "release-manifest-v*.json" -File)
          if ($manifests.Count -ne 1) { throw "Expected exactly one downloaded release manifest" }
          $manifest = Get-Content -LiteralPath $manifests[0].FullName -Raw | ConvertFrom-Json
          $source = (git rev-parse HEAD).Trim()
          if ($manifest.source_commit -ne $source -or $manifest.tag -ne $env:GITHUB_REF_NAME) {
            throw "Downloaded release manifest provenance mismatch"
          }
          $extensionRecords = @($manifest.assets | Where-Object { $_.kind -eq "browser_extension" })
          if ($extensionRecords.Count -ne 1) { throw "Expected exactly one extension ZIP in the release manifest" }
          foreach ($record in $manifest.assets) {
            $path = Join-Path $download ([string]$record.name)
            if (-not (Test-Path -LiteralPath $path)) {
              $normalizedName = ([string]$record.name).Replace(' ', '.')
              $path = Join-Path $download $normalizedName
            }
            if (-not (Test-Path -LiteralPath $path)) { throw "Downloaded asset missing: $($record.name)" }
            $file = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ([int64]$file.Length -ne [int64]$record.bytes -or $hash -ne [string]$record.sha256) {
              throw "Downloaded asset verification failed: $($record.name)"
            }
          }
          $extensionPath = Join-Path $download ([string]$extensionRecords[0].name)
          python scripts/build_browser_extension.py --repo-root . --verify $extensionPath --expect-version ([string]$manifest.version)
          if ($LASTEXITCODE -ne 0) { throw "Downloaded extension ZIP structure validation failed" }
          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          $tagType = [string]$tagRef.object.type
          $tagSha = [string]$tagRef.object.sha
          $depth = 0
          while ($tagType -eq "tag") {
            if ($depth -ge 8) { throw "Release tag indirection is unexpectedly deep" }
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            $tagType = [string]$tagObject.object.type
            $tagSha = [string]$tagObject.object.sha
            $depth += 1
          }
          if ($tagType -ne "commit" -or $tagSha -ne $source) {
            throw "Release tag does not resolve to the built source"
          }
