[package]
name = "vault-unified-desktop"
version = "1.4.0"
description = "Vault Unified Desktop"
authors = ["PureSaber"]
edition = "2021"

[lib]
name = "vault_unified_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
sha2 = "0.10"
zeroize = "1"
# Release assets are plain NSIS/MSI installers (see `allowed_asset` in
# src/updates.rs), so the plugin's default `zip` archive support is unused.
tauri-plugin-updater = { version = "~2.13.3", default-features = false, features = ["rustls-tls", "system-proxy"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[[test]]
name = "updater_transport"
path = "src/update_tests.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials", "Security_Cryptography", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
