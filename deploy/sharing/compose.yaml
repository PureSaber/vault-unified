services:
  sharing:
    build:
      context: ../..
      dockerfile: deploy/sharing/Dockerfile
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - sharing-data:/data
    secrets:
      - sharing_admin
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
secrets:
  sharing_admin:
    file: ./secrets/admin-token.txt
volumes:
  sharing-data:
